# Karta Home Assistant: podgląd pracy rekuperatora
# 1) Skopiuj ha/rekuperator.svg do /config/www/  (dostępny jako /local/rekuperator.svg)
# 2) Dashboard -> Edytuj -> Dodaj kartę -> Ręcznie (YAML) -> wklej poniższe
# 3) Sprawdź ID encji (Ustawienia -> Urządzenia -> Rekuperator) i popraw, jeśli się różnią
type: picture-elements
image: /local/rekuperator.svg
elements:
  - type: state-label
    entity: sensor.rekuperator_temperatura_czerpni_zewn
    style:
      left: 19.1%
      top: 28.3%
      color: "#fff"
      font-size: "19px"
      font-weight: "700"
      text-shadow: "0 1px 2px rgba(0,0,0,.35)"
  - type: state-label
    entity: sensor.rekuperator_temperatura_wyrzutni
    style:
      left: 19.1%
      top: 68.3%
      color: "#fff"
      font-size: "19px"
      font-weight: "700"
      text-shadow: "0 1px 2px rgba(0,0,0,.35)"
  - type: state-label
    entity: sensor.rekuperator_temperatura_wywiewu
    style:
      left: 85.4%
      top: 28.3%
      color: "#fff"
      font-size: "19px"
      font-weight: "700"
      text-shadow: "0 1px 2px rgba(0,0,0,.35)"
  - type: state-label
    entity: sensor.rekuperator_temperatura_nawiewu
    style:
      left: 85.4%
      top: 68.3%
      color: "#fff"
      font-size: "19px"
      font-weight: "700"
      text-shadow: "0 1px 2px rgba(0,0,0,.35)"
