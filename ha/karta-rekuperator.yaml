    entity: sensor.rekuperator_przeplyw_wywiewu
    style:
      left: 85.4%
      top: 35.3%
      color: "#374151"
      font-size: "13px"
      font-weight: "600"
  - type: state-label
    entity: sensor.rekuperator_przeplyw_nawiewu
    style:
      left: 85.4%
      top: 79.7%
      color: "#374151"
      font-size: "13px"
      font-weight: "600"
  - type: state-label
    entity: sensor.rekuperator_wentylator_wywiewu
    style:
      left: 32.0%
      top: 75.3%
      color: "#374151"
      font-size: "13px"
      font-weight: "600"
  - type: state-label
    entity: sensor.rekuperator_wentylator_nawiewu
    style:
      left: 68.0%
      top: 75.3%
      color: "#374151"
      font-size: "13px"
      font-weight: "600"
  - type: state-label
    entity: sensor.rekuperator_sprawnosc_odzysku
