<text x="560" y="765" class="h" style="text-anchor:start">Uwagi</text>
<text x="560" y="790" class="n">• Brak komunikacji → zamień TXD/RXD, potem A/B (bezpieczne, nic nie uszkodzi).</text>
<text x="560" y="809" class="n">• Terminator 120 Ω: przy krótkim kablu (kilka m) zwykle zbędny.</text>
<text x="560" y="828" class="n">• Ekran kabla (jeśli jest) łącz tylko z jednej strony, z SGND.</text>
<text x="560" y="847" class="n">• Przy flashowaniu przez USB odłącz 5 V z przetwornicy albo używaj OTA.</text>
<text x="560" y="866" class="n">• Prace w strefie 230 V – przy wyłączonym zasilaniu, wykonuje uprawniona osoba.</text>
