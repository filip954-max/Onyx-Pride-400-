# ESPHome – SKANER REJESTRÓW Modbus (Frapol OnyX Pride 400 / Plum ecoVENT)
# Tymczasowy firmware do „nauki” mapy rejestrów. Tylko ODCZYT – nic nie zapisuje do sterownika.
#
# Jak używać:
#   1. Wgraj ten plik zamiast rekuperator.yaml (ta sama nazwa urządzenia, więc działa przez OTA):
#        esphome run esphome/skaner-rejestrow.yaml
#   2. Obserwuj logi:  esphome logs esphome/skaner-rejestrow.yaml   (albo w HA: ESPHome -> Logi)
#      Po starcie każdy rejestr pojawi się raz, np.:
#        REG  17 =     1 | s16      1 | 0x0001
#      Potem w logu pokazują się TYLKO rejestry, które zmieniły wartość.
#   3. Zmień coś na panelu (tryb, wietrzenie, party itd.) i zobacz, który rejestr się zmienił.
#      Temperatury szukaj w kolumnie s16 (np. 215 = 21,5 °C przy skali x0,1).
#   4. Błąd „exception: 2” dla danego adresu oznacza, że taki rejestr nie istnieje – to normalne.
#   5. Przycisk „Skaner – restart” w HA wypisuje ponownie wszystkie rejestry.
#   6. Na koniec wgraj z powrotem esphome/rekuperator.yaml.
#
# Pełny przebieg zajmuje do ~1 min (każdy rejestr czytany osobno, żeby brakujące adresy
# nie blokowały odczytu sąsiednich).

esphome:
  name: rekuperator
  friendly_name: Rekuperator

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  id: uart_rs485
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 19200
  parity: NONE
  stop_bits: 2

modbus:
  id: mb
  uart_id: uart_rs485

modbus_controller:
  - id: onyx
    modbus_id: mb
    address: 1
    update_interval: 60s

button:
  - platform: restart
    name: "Skaner – restart"

# Rejestry holding 0–299. Jedna linia = jeden rejestr; filtr delta przepuszcza tylko zmiany.
sensor:
  - {platform: modbus_controller, modbus_controller_id: onyx, id: r0, internal: true, register_type: holding, address: 0, value_type: U_WORD, reuse_previous_range: false, filters: [{delta: 0.5}], on_value: [{logger.log: {level: INFO, format: "REG %3d = %5u | s16 %6d | 0x%04X", args: ["0", "(uint16_t) x", "(int16_t)(uint16_t) x", "(uint16_t) x"]}}]}
